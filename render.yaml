# Render Blueprint: creates the web app, PostgreSQL database and daily reminder job.
# In Render: New + → Blueprint → choose this repository. See docs/DEPLOYMENT.md.
envVarGroups:
  - name: firecert-shared
    envVars:
      - key: APP_URL # e.g. https://app.techvu.co.uk (set after adding your domain)
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Techvu Ltd <info@techvu.co.uk>"
      - key: OFFICE_NOTIFY_EMAIL
        value: "info@techvu.co.uk"
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: firecert
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    disk:
      name: certificates
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: firecert-shared
      - key: DATABASE_URL
        fromDatabase:
          name: firecert-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/storage

  - type: cron
    name: firecert-reminders
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "45 7 * * *" # daily, 07:45 UTC
    buildCommand: npm ci
    startCommand: npm run reminders
    envVars:
      - fromGroup: firecert-shared
      - key: DATABASE_URL
        fromDatabase:
          name: firecert-db
          property: connectionString

databases:
  - name: firecert-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"

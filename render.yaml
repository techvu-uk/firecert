# FREE TEST SETUP – sleeps when idle, database expires after 30 days, no reminders job.
services:
  - type: web
    name: firecert
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: firecert-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: firecert-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
